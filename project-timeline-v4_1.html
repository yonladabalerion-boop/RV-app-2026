    <div id="sc-${s.id}" style="display:flex;gap:4px;align-items:center">
      <button onclick="showSprintForm('${s.id}')" style="background:none;border:1px solid #E5E7EB;cursor:pointer;color:#6B7280;font-size:11px;padding:4px 10px;border-radius:6px" onmouseenter="this.style.background='#F3F4F6'" onmouseleave="this.style.background='none'">Edit</button>
      <button onclick="confirmDelSprint('${s.id}')" style="background:none;border:none;cursor:pointer;color:#D1D5DB;font-size:16px;padding:4px 6px;border-radius:6px;line-height:1" title="Delete" onmouseenter="this.style.color='#EF4444';this.style.background='#FEF2F2'" onmouseleave="this.style.color='#D1D5DB';this.style.background='none'">···</button>
    </div>
  </div>`).join('');
}
function showSprintForm(editId){
  editingSprintId=editId;
  const existing=editId?SPRINTS.find(s=>s.id===editId):null;
  sprintColor=existing?existing.color:SPRINT_COLORS[0];
  document.getElementById('sprint-form-area').innerHTML=`<div class="form-card">
    <h3>${editId?'Edit Sprint':'New Sprint'}</h3>
    <div class="grid2" style="margin-bottom:12px">
      <div style="grid-column:1/-1"><div class="fld-lbl">Sprint Name *</div><input id="sp-name" value="${existing?existing.name:''}" placeholder="e.g. Sprint 1"><div class="err" id="sp-err"></div></div>
      <div><div class="fld-lbl">Start</div><input type="date" id="sp-start" value="${existing?d2date(existing.s):d2date(0)}" min="2026-06-04" max="2026-08-25"></div>
      <div><div class="fld-lbl">End</div><input type="date" id="sp-end" value="${existing?d2date(existing.e):d2date(13)}" min="2026-06-04" max="2026-08-25"></div>
      <div style="grid-column:1/-1"><div class="fld-lbl" style="margin-bottom:6px">Color</div><div id="sp-colors">${colorSwatches(sprintColor,'setSprintColor')}</div></div>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn-cancel" onclick="document.getElementById('sprint-form-area').innerHTML='';editingSprintId=null">Cancel</button>
      <button class="btn-save" style="background:${sprintColor}" id="sp-save-btn" onclick="saveSprint('${editId||''}')">✓ ${editId?'Update':'Create'} Sprint</button>
    </div>
  </div>`;
}
function setSprintColor(c){
  sprintColor=c;
  document.getElementById('sp-colors').innerHTML=colorSwatches(c,'setSprintColor');
  const btn=document.getElementById('sp-save-btn');if(btn)btn.style.background=c;
}
function saveSprint(editId){
  const name=(document.getElementById('sp-name').value||'').trim();
  const err=document.getElementById('sp-err');
  if(!name){err.textContent='Sprint name is required';return;}
  const s=date2d(document.getElementById('sp-start').value);
  const e=date2d(document.getElementById('sp-end').value);
  if(e<s){err.textContent='End must be after start';return;}
  if(editId){
    const sp=SPRINTS.find(x=>x.id===editId);
    if(sp){sp.name=name;sp.s=s;sp.e=e;sp.color=sprintColor;}
  } else {
    SPRINTS.push({id:'sp-'+Date.now(),name,s,e,color:sprintColor});
  }
  editingSprintId=null;
  renderSprintsTab();
}
function confirmDelSprint(id){
  document.getElementById('sc-'+id).innerHTML=`<div class="confirm-row">
    <span style="font-size:11px;color:#B91C1C;font-weight:600">Delete?</span>
    <button class="confirm-yes" onclick="doDelSprint('${id}')">Yes</button>
    <button class="confirm-no" onclick="renderSprintsTab()">No</button>
  </div>`;
}
function doDelSprint(id){SPRINTS=SPRINTS.filter(s=>s.id!==id);renderSprintsTab();}

// ─── NEW TASK shortcut ────────────────────────────────────────────────────────
function openNewTask(){mpTab='tasks';mpTaskSel=null;openManage();setTimeout(showNewTaskForm,50);}

// ─── EXPORT MARKDOWN ─────────────────────────────────────────────────────────
function exportMarkdown(){
  const lines=[];
  const now=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});

  lines.push(`# 📋 Project Timeline`);
  lines.push(`_Exported ${now}_`);
  lines.push('');

  // ── Milestones ──
  lines.push(`## 🔷 Milestones`);
  lines.push('');
  lines.push('| Milestone | Date | Type |');
  lines.push('|-----------|------|------|');
  MS_DATA.forEach(m=>{
    const type=m.final?'🎯 Final':'—';
    lines.push(`| ${m.lbl} | ${fmtD(m.d)} | ${type} |`);
  });
  lines.push('');

  // ── Groups & Tasks ──
  GROUPS.forEach(grp=>{
    lines.push(`## ${grp.name}`);
    lines.push('');

    grp.tasks.forEach(task=>{
      const owners=task.o.join(', ');
      const warn=task.conflict?' ⚠️ Conflict':'';
      lines.push(`### ${task.conflict?'⚠️ ':''}${task.name}${warn}`);
      if(task.goal) lines.push(`> ${task.goal}`);
      lines.push('');
      lines.push(`| | |`);
      lines.push(`|---|---|`);
      lines.push(`| **Track** | ${task.track} |`);
      lines.push(`| **Start** | ${fmtD(task.s)} |`);
      lines.push(`| **End / Deadline** | ${fmtD(task.e)} |`);
      lines.push(`| **Owners** | ${owners} |`);

      // sprint if assigned
      const sp=SPRINTS.find(s=>s.id===task.sprintId);
      if(sp) lines.push(`| **Sprint** | ${sp.name} |`);

      lines.push('');

      // subtasks
      const subs=task.subtasks||[];
      if(subs.length){
        lines.push(`**Subtasks:**`);
        lines.push('');
        lines.push('| Subtask | Description | Start | Deadline | Assignee | Sprint |');
        lines.push('|---------|-------------|-------|----------|----------|--------|');
        subs.forEach(s=>{
          const subSp=SPRINTS.find(x=>x.id===s.sprintId);
          const start=s.startDay!==undefined?fmtD(s.startDay):'—';
          const end=s.endDay!==undefined?fmtD(s.endDay):'—';
          const owners=(s.owners||[]).join(', ')||'—';
          const spName=subSp?subSp.name:'—';
          const desc=(s.description||'—').replace(/\n/g,' ');
          lines.push(`| ${s.name} | ${desc} | ${start} | ${end} | ${owners} | ${spName} |`);
        });
        lines.push('');
      }

      lines.push('---');
      lines.push('');
    });
  });

  // ── Sprints summary ──
  if(SPRINTS.length){
    lines.push(`## 🏃 Sprints`);
    lines.push('');
    lines.push('| Sprint | Start | End | Duration |');
    lines.push('|--------|-------|-----|----------|');
    SPRINTS.forEach(s=>{
      lines.push(`| ${s.name} | ${fmtD(s.s)} | ${fmtD(s.e)} | ${s.e-s.s+1} days |`);
    });
    lines.push('');
  }

  // ── People ──
  lines.push(`## 👥 Team`);
  lines.push('');
  lines.push('| Name | Role | Initials |');
  lines.push('|------|------|----------|');
  PEOPLE.forEach(p=>{
    lines.push(`| ${p.name} | ${p.role||'—'} | ${p.initials} |`);
  });
  lines.push('');

  const md=lines.join('\n');
  const blob=new Blob([md],{type:'text/markdown;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`project-timeline-${new Date().toISOString().slice(0,10)}.md`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

renderBody();
