<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Timeline</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#F9FAFB;color:#1F2937;font-size:13px}
button,input,select,textarea{font-family:inherit}
input,select,textarea{width:100%;border:1.5px solid #E5E7EB;border-radius:7px;padding:7px 10px;font-size:13px;color:#1F2937;outline:none;background:#FAFAFA;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:#378ADD}
textarea{resize:vertical;line-height:1.55}

/* ── TOP BAR ── */
#topbar{position:sticky;top:0;z-index:60;background:#fff;border-bottom:0.5px solid #E5E7EB;box-shadow:0 1px 4px rgba(0,0,0,.05)}
#title-row{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:0.5px solid #F3F4F6}
#title-row strong{font-size:13px;font-weight:700;letter-spacing:-.01em}
.top-actions{display:flex;gap:6px}
.btn-dark{display:inline-flex;align-items:center;gap:5px;padding:5px 13px;border-radius:7px;background:#1F2937;color:#fff;border:none;font-size:12px;font-weight:600;cursor:pointer}
.btn-dark:hover{opacity:.85}
.btn-outline{display:inline-flex;align-items:center;gap:5px;padding:5px 13px;border-radius:7px;background:#fff;color:#374151;border:1px solid #D1D5DB;font-size:12px;font-weight:500;cursor:pointer}
.btn-outline:hover{background:#F9FAFB}
#filter-row{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:16px}
#chips{display:flex;align-items:center;gap:4px;overflow:hidden}
.filter-lbl{font-size:10px;font-weight:700;color:#C4C8D0;letter-spacing:.07em;margin-right:6px;flex-shrink:0}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px 3px 4px;border-radius:999px;font-size:11px;font-weight:500;border:1.5px solid #E5E7EB;background:#fff;color:#6B7280;cursor:pointer;white-space:nowrap;transition:all .12s;user-select:none}
.chip.all{padding:3px 12px}
.chip.on{border-color:var(--c)!important;background:color-mix(in srgb,var(--c) 12%,#fff)!important;color:var(--c)!important}
.chip.all.on{background:#1F2937!important;color:#fff!important;border-color:#1F2937!important}
.chip-av{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:#fff;flex-shrink:0}
#legend{display:flex;align-items:center;gap:10px;flex-shrink:0}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:#6B7280;white-space:nowrap}
.leg-sq{width:11px;height:11px;border-radius:2px;flex-shrink:0}

/* ── ROW TABS ── */
#row-tabs{height:32px;display:flex;align-items:center;padding:0 16px;gap:2px;border-bottom:0.5px solid #E5E7EB;background:#FAFAFA}
.row-tab{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:500;color:#9CA3AF;border:none;background:none;cursor:pointer;transition:all .12s;user-select:none}
.row-tab:hover{background:#F3F4F6;color:#374151}
.row-tab.on{background:#E8F0FB;color:#185FA5;font-weight:600}
.row-tab-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:#888780}
.row-tab.on .row-tab-dot{background:#185FA5}

/* ── GANTT ── */
#gantt-shell{display:flex;overflow:hidden}
#left-col{width:200px;min-width:200px;flex-shrink:0;border-right:0.5px solid #E5E7EB;background:#fff;z-index:30;display:flex;flex-direction:column}
#left-header{height:108px;background:#fff;border-bottom:2px solid #E5E7EB;display:flex;align-items:flex-end;padding:0 12px 8px 16px;flex-shrink:0;transition:height .2s}
#left-header.ms-hidden{height:52px}
#left-header span{font-size:11px;font-weight:600;color:#9CA3AF;letter-spacing:.04em}
#left-body{flex:1;overflow:hidden}
#right-scroll{flex:1;overflow-x:auto;overflow-y:hidden;display:flex;flex-direction:column}
#right-header{flex-shrink:0;border-bottom:2px solid #E5E7EB;background:#fff;overflow:visible}
#ms-row{height:56px;position:relative;overflow:visible;pointer-events:none;transition:height .2s,opacity .2s;border-bottom:0.5px solid #F3F4F6}
#ms-row.hidden{height:0;opacity:0;overflow:hidden;border:none}
#month-row{display:flex;height:28px;border-bottom:0.5px solid #E5E7EB}
#day-row{display:flex;height:24px}
#right-body{flex:1;overflow:hidden;position:relative}

/* group headers */
.grp-hdr-l{height:40px;display:flex;align-items:center;padding:0 12px 0 14px;gap:7px;cursor:pointer;user-select:none;background:#F3F4F6;border-bottom:0.5px solid #E5E7EB;flex-shrink:0}
.grp-hdr-r{height:40px;background:#F3F4F6;border-bottom:0.5px solid #E5E7EB;display:flex;flex-shrink:0}
.grp-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}

/* task rows */
.task-l{height:48px;display:flex;flex-direction:column;justify-content:center;padding:0 10px 0 16px;gap:3px;background:#fff;border-bottom:0.5px solid #F3F4F6;flex-shrink:0;transition:opacity .18s}
.task-l.conflict-row{border-left:3px solid #E24B4A;padding-left:13px}
.task-name-r{display:flex;align-items:center;gap:5px}
.tlbl{font-size:13px;font-weight:500;color:#1F2937;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.avstack{display:flex;align-items:center}
.av{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:#fff;border:2px solid #fff;flex-shrink:0}
.task-r{height:48px;position:relative;border-bottom:0.5px solid #F3F4F6;flex-shrink:0;transition:opacity .18s}
.dimmed .task-l,.dimmed .task-r{opacity:.15}
.bar{position:absolute;border-radius:6px;display:flex;align-items:center;padding:0 8px;cursor:pointer;transition:filter .12s;height:28px}
.bar:hover{filter:brightness(.9)}
.bar-lbl{font-size:11px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.bar-wi{position:absolute;right:6px;font-size:10px;color:#fff;pointer-events:none}
.conf-ring{position:absolute;border:2px dashed #E24B4A;border-radius:9px;pointer-events:none}
.out-lbl{position:absolute;font-size:11px;color:#6B7280;white-space:nowrap;display:flex;align-items:center;pointer-events:none}
.ms-pin{position:absolute;top:0;pointer-events:all;cursor:default;display:flex;flex-direction:column;align-items:center;width:0}
.ms-dia{width:9px;height:9px;border-radius:1.5px;transform:rotate(45deg);margin-top:4px;flex-shrink:0;transition:transform .15s}
.ms-pin:hover .ms-dia{transform:rotate(45deg) scale(1.25)}
.ms-name{margin-top:8px;font-size:9px;font-weight:600;color:#374151;white-space:nowrap;transform:translateX(-50%);line-height:1.2;text-align:center}
.ms-date{font-size:9px;color:#9CA3AF;white-space:nowrap;transform:translateX(-50%);line-height:1.2;text-align:center;margin-top:1px}
.ms-name.fin{color:#D85A30}
.ms-date.fin{color:#D85A30;opacity:.8}
.ms-vl{position:absolute;top:0;bottom:0;width:1px;border-left:1px dashed #D1D5DB;pointer-events:none;z-index:2}
.ms-vl.fin{border-left:2px solid #D85A30}

/* ── COL HOVER ── */
#col-highlight{position:absolute;top:0;bottom:0;width:${DAY_W}px;background:rgba(55,138,221,.08);pointer-events:none;z-index:1;display:none;transition:left 0s}

/* ── CARD POPUP ── */
#card-ov{display:none;position:fixed;inset:0;z-index:100}
#card{display:none;position:fixed;width:340px;z-index:101;background:#fff;border-radius:12px;box-shadow:0 12px 36px rgba(0,0,0,.14);overflow:hidden;max-height:88vh;flex-direction:column;animation:popIn .13s ease}
@keyframes popIn{from{opacity:0;transform:translateY(4px) scale(.97)}to{opacity:1;transform:none}}
.c-acc{height:4px;flex-shrink:0}
.c-inner{overflow-y:auto;padding:14px 16px 16px;font-size:12px}
.c-close{position:absolute;top:10px;right:12px;background:none;border:none;cursor:pointer;font-size:16px;color:#9CA3AF;z-index:5}
.c-close:hover{color:#374151}

/* ── MANAGE PANEL ── */
#mp-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;backdrop-filter:blur(2px)}
#mp{display:none;position:fixed;top:0;right:0;bottom:0;width:720px;max-width:100vw;background:#fff;box-shadow:-8px 0 32px rgba(0,0,0,.15);flex-direction:column;z-index:201;animation:slideIn .22s ease}
@keyframes slideIn{from{transform:translateX(100%);opacity:.6}to{transform:none;opacity:1}}
#mp-hdr{padding:18px 24px 0;border-bottom:1px solid #E5E7EB;flex-shrink:0}
#mp-body{flex:1;overflow-y:auto;padding:24px}
.mp-tab{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:500;color:#9CA3AF;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;white-space:nowrap}
.mp-tab.on{font-weight:700;color:#1F2937;border-bottom-color:#1F2937}
.mp-tab:hover{color:#374151}
.mp-tab svg{flex-shrink:0;transition:color .15s}
.fld-lbl{font-size:10px;font-weight:700;color:#9CA3AF;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.form-card{border:1.5px solid #E5E7EB;border-radius:10px;padding:16px;background:#FAFAFA;margin-bottom:16px}
.form-card h3{font-size:13px;font-weight:700;color:#1F2937;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-save{display:inline-flex;align-items:center;gap:5px;padding:7px 18px;border-radius:7px;border:none;background:#1F2937;color:#fff;font-size:12px;font-weight:700;cursor:pointer}
.btn-save:hover{opacity:.85}
.btn-cancel{padding:7px 16px;border-radius:7px;border:1.5px solid #E5E7EB;background:#fff;color:#6B7280;font-size:12px;cursor:pointer}
.btn-cancel:hover{background:#F3F4F6}
.btn-del{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:6px;border:1.5px solid #FECACA;background:#FEF2F2;color:#EF4444;font-size:11px;cursor:pointer}
.btn-del:hover{background:#FEE2E2}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid #E5E7EB;border-radius:10px;background:#fff;margin-bottom:8px}
.color-dot{width:22px;height:22px;border-radius:50%;border:none;cursor:pointer;flex-shrink:0}
.err{font-size:11px;color:#EF4444;margin-top:3px}
table{width:100%;border-collapse:collapse}
thead th{padding:10px 12px;text-align:left;font-size:10px;font-weight:700;color:#6B7280;background:#F9FAFB;text-transform:uppercase;letter-spacing:.05em}
tbody tr{border-top:1px solid #F3F4F6;cursor:pointer;transition:background .1s}
tbody tr.no-click{cursor:default}
tbody tr:hover{background:#F0F9FF}
tbody td{padding:10px 12px;font-size:12px}
.tbl-wrap{border:1px solid #E5E7EB;border-radius:10px;overflow:hidden;margin-bottom:12px}
.owner-toggle{display:inline-flex;align-items:center;gap:5px;padding:4px 8px 4px 4px;border-radius:999px;border:1.5px solid #E5E7EB;background:#fff;cursor:pointer;font-size:11px;font-weight:500;color:#6B7280;transition:all .12s;user-select:none}
.owner-toggle.on{border-color:var(--oc);background:color-mix(in srgb,var(--oc) 12%,#fff);color:var(--oc)}
.owner-toggle .ot-av{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:7px;font-weight:800;color:#fff}
.color-swatch{width:22px;height:22px;border-radius:50%;border:none;cursor:pointer;outline:none;transition:transform .1s}
.color-swatch:hover{transform:scale(1.15)}
.color-swatch.sel{outline:3px solid var(--sc);outline-offset:2px}
.back-btn{display:inline-flex;align-items:center;gap:5px;border:none;background:#F3F4F6;border-radius:7px;padding:6px 10px;cursor:pointer;color:#374151;font-size:12px;font-weight:600}
.back-btn:hover{background:#E5E7EB}
.detail-tab{padding:8px 16px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:500;color:#9CA3AF;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.detail-tab.on{font-weight:700;color:#1F2937}
.search-wrap{position:relative;flex:1}
.search-wrap input{padding-left:30px}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#9CA3AF;font-size:13px;pointer-events:none}
.tag-pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
.confirm-row{display:flex;gap:6px;align-items:center}
.confirm-yes{padding:4px 10px;border-radius:6px;border:none;background:#EF4444;color:#fff;font-size:11px;font-weight:700;cursor:pointer}
.confirm-no{padding:4px 10px;border-radius:6px;border:1.5px solid #E5E7EB;background:#fff;color:#6B7280;font-size:11px;cursor:pointer}
.subtask-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid #E5E7EB;border-radius:8px;margin-bottom:6px;background:#fff}
</style>
</head>
<body>

<div id="topbar">
  <div id="title-row">
    <strong>Project Timeline</strong>
    <div class="top-actions">
      <button class="btn-dark" onclick="openNewTask()">+ New Task</button>
      <button class="btn-outline" onclick="exportMarkdown()">↓ Export MD</button>
      <button class="btn-outline" onclick="openManage()">⚙ Manage</button>
    </div>
  </div>
  <div id="filter-row">
    <div style="display:flex;align-items:center">
      <span class="filter-lbl">FILTER</span>
      <div id="chips"></div>
    </div>
    <div id="legend">
      <div class="leg"><span class="leg-sq" style="background:#378ADD"></span>CMS</div>
      <div class="leg"><span class="leg-sq" style="background:#1D9E75"></span>Mobile</div>
      <div class="leg"><span class="leg-sq" style="background:#7F77DD"></span>QA/UAT</div>
      <div class="leg"><span class="leg-sq" style="background:#D85A30"></span>Delivery</div>
      <div class="leg"><span class="leg-sq" style="background:#E24B4A"></span>⚠ Conflict</div>
    </div>
  </div>
  <div id="row-tabs">
    <span style="font-size:10px;font-weight:700;color:#C4C8D0;letter-spacing:.07em;margin-right:6px">ROWS</span>
    <button class="row-tab on" id="rt-milestone" onclick="toggleRowTab('milestone')">
      <span class="row-tab-dot"></span>Milestone
    </button>
  </div>
</div>

<div id="gantt-shell">
  <div id="left-col">
    <div id="left-header"><span>TASK / OWNER</span></div>
    <div id="left-body"></div>
  </div>
  <div id="right-scroll">
    <div id="right-header">
      <div id="ms-row"></div>
      <div id="month-row"></div>
      <div id="day-row"></div>
    </div>
    <div id="right-body">
      <div id="col-highlight" style="position:absolute;top:0;bottom:0;width:18px;background:rgba(55,138,221,.07);pointer-events:none;z-index:1;display:none"></div>
    </div>
  </div>
</div>

<!-- Task card -->
<div id="card-ov" onclick="closeCard()"></div>
<div id="card">
  <div class="c-acc" id="c-acc"></div>
  <button class="c-close" onclick="closeCard()">✕</button>
  <div class="c-inner" id="c-inner"></div>
</div>

<!-- Manage panel -->
<div id="mp-ov" onclick="closeManage()"></div>
<div id="mp">
  <div id="mp-hdr">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div>
        <div style="font-size:18px;font-weight:800;color:#111827">Manage</div>
        <div id="mp-meta" style="font-size:12px;color:#9CA3AF;margin-top:2px"></div>
      </div>
      <button onclick="closeManage()" style="border:none;background:#F3F4F6;border-radius:8px;padding:7px 9px;cursor:pointer;color:#6B7280;font-size:16px">✕</button>
    </div>
    <div style="display:flex" id="mp-tabs"></div>
  </div>
  <div id="mp-body"></div>
</div>

<script>
// ─── CONSTANTS ───────────────────────────────────────────────────────────────
const DAY_W=18,LABEL_W=200,ROW_H=48,BAR_H=28,GRP_H=40;
const START=new Date(2026,5,4);
const START_DOW=3;

  {name:'July',  label:'July 2026',  s:27, n:31, fg:'#B45309', bg:'#FFFBEB'},

];

  {id:'m8',lbl:'🎯 Final delivery',d:dFrom(2026,8,13),final:true},
];
const TC={CMS:'#378ADD',Mobile:'#1D9E75',QA:'#7F77DD','Delivery/UAT':'#D85A30',Other:'#888780'};

// ─── STATE ───────────────────────────────────────────────────────────────────
let PEOPLE=[
  {name:'Mos',  color:'#EA580C',initials:'Mo', role:'BE'},
  {name:'Ping', color:'#D97706',initials:'Pg', role:'FE'},
  {name:'Tat',  color:'#059669',initials:'T',  role:'FE'},

];
let GROUPS=[
  {name:'CMS',color:'#378ADD',tasks:[
    {id:'c0',name:'CMS Sprint 1',       track:'CMS',o:["Mos","Mos"],s:0, e:14,goal:'CMS Sprint 1 (4–18 June): Reward CMS + ROPS integrate UI.'},
    {id:'c1',name:'CMS Reward Module',  track:'CMS',o:["Jah","Mos"],s:0, e:21,goal:'Build the loyalty reward module: reward tiers, point rules, and redemption flows.'},
    {id:'c2',name:'CMS Sprint 2',       track:'CMS',o:["Mos","Mos"],s:14,e:27,goal:'CMS Sprint 2 (18 June – 1 July): เก็บ Reward CMS.'},
    {id:'c3',name:'CMS Event Module',   track:'CMS',o:["Jah"],        s:35,e:63,goal:'CMS Sprint 3 (8–22 July): Event management module — scheduling, ticketing, live banners.'},
    {id:'c4',name:'CMS Sprint 4',       track:'CMS',o:["Mos","Mos"],s:49,e:62,goal:'CMS Sprint 4 (23 July – 5 Aug): Quiz – store CMS.'},
    {id:'c5',name:"CMS ไข่ปลา Release",track:'CMS',o:["Jah","Mos"],s:63,e:71,conflict:true,goal:'Deliver the final ไข่ปลา feature set to production CMS.'},
    {id:'c6',name:'CMS Event Finalize', track:'CMS',o:["Jah","Ping"],s:65,e:71,conflict:true,goal:'Complete QA sign-off on event module and prepare release notes.'},

  {name:'Mobile',color:'#1D9E75',tasks:[

    {id:'q4',name:'Test full CMS+Mobile',track:'QA',        o:["Jah"],            s:41,e:49,goal:'15–23 July: Test full CMS + Mobile.'},

let SPRINTS=[];
let collapsed=new Set();
let selPersons=new Set();

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function dFrom(y,m,d){return Math.round((new Date(y,m-1,d)-START)/86400000)}
function isWE(d){const w=(START_DOW+d)%7;return w===0||w===6}
function isMon(d){return (START_DOW+d)%7===1}
function fmtD(off){return new Date(GRID_MS+off*86400000).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function d2date(off){return new Date(GRID_MS+off*86400000).toISOString().slice(0,10)}
function date2d(s){return Math.round((new Date(s).getTime()-GRID_MS)/86400000)}
function pData(name){return PEOPLE.find(p=>p.name===name)||{color:'#888',initials:(name||'?').slice(0,2).toUpperCase()}}
function dayX(d){return d*DAY_W}
function gridW(){return TOTAL_DAYS*DAY_W}
function initials(name){return name.split(/\s+/).map(w=>w[0]||'').join('').toUpperCase().slice(0,2)||'?'}
function getTask(id){for(const g of GROUPS)for(const t of g.tasks)if(t.id===id)return t;return null}
function getGroup(taskId){for(const g of GROUPS)if(g.tasks.find(t=>t.id===taskId))return g;return null}
function allTasks(){return GROUPS.flatMap(g=>g.tasks.map(t=>({...t,groupName:g.name,groupColor:g.color})))}

// ─── AVATAR HTML ─────────────────────────────────────────────────────────────
function avH(name,size=20,overlap=false){
  const p=pData(name);
  const title=p.role?`${name} (${p.role})`:name;
  return `<span class="av" style="width:${size}px;height:${size}px;min-width:${size}px;font-size:${Math.round(size*.38)}px;background:${p.color};${overlap?'margin-left:-6px':''}" title="${title}">${p.initials}</span>`;
}
function avStack(owners,size=20){return owners.map((o,i)=>avH(o,size,i>0)).join('')}

// ─── COLOR SWATCHES ──────────────────────────────────────────────────────────
function colorSwatches(selected,onchangeFn){
  return `<div style="display:flex;gap:6px;flex-wrap:wrap">`+
    PRESET_COLORS.map(c=>`<button class="color-swatch${c===selected?' sel':''}" style="background:${c};--sc:${c}" onclick="${onchangeFn}('${c}')"></button>`).join('')+
  `</div>`;
}

// ─── OWNER PICKER ─────────────────────────────────────────────────────────────
function ownerPicker(selected,inputId){
  return `<div style="display:flex;gap:5px;flex-wrap:wrap" id="${inputId}">` +
    PEOPLE.map(p=>{
      const on=selected.includes(p.name);
      return `<button class="owner-toggle ${on?'on':''}" style="--oc:${p.color}" onclick="toggleOwner('${inputId}','${p.name.replace(/'/g,"\\'")}')">
        <span class="ot-av" style="background:${p.color}">${p.initials}</span>${p.name}
      </button>`;
    }).join('')+
  `</div>`;
}
function toggleOwner(pickerId,name){
  const el=document.getElementById(pickerId);
  if(!el)return;
  const btn=[...el.querySelectorAll('.owner-toggle')].find(b=>b.textContent.trim()===name||(b.querySelector('.ot-av')&&b.textContent.includes(name)));
  if(btn){btn.classList.toggle('on');}
}
function getOwners(pickerId){
  const el=document.getElementById(pickerId);
  if(!el)return[];
  return [...el.querySelectorAll('.owner-toggle.on')].map(b=>{
    const t=b.textContent.trim();
    const p=PEOPLE.find(x=>t.includes(x.name));
    return p?p.name:t;
  });
}

// ─── CHIPS ───────────────────────────────────────────────────────────────────
function renderChips(){
  const el=document.getElementById('chips');
  const allOn=selPersons.size===0;
  let h=`<button class="chip all ${allOn?'on':''}" onclick="selP('All',event)">All</button>`;
  for(const p of PEOPLE){
    const on=selPersons.has(p.name);
    const roleC=p.role?ROLE_COLORS[p.role]||'#888':'';
    h+=`<button class="chip ${on?'on':''}" style="--c:${p.color}" onclick="selP('${p.name.replace(/'/g,"\\'")}',event)" title="${p.role||''}">
      <span class="chip-av" style="background:${p.color}">${p.initials}</span>
      <span>${p.name}</span>
      ${p.role?`<span style="font-size:9px;font-weight:700;color:${on?p.color:roleC};opacity:.75;margin-left:-2px">${p.role}</span>`:''}
    </button>`;
  }
  el.innerHTML=h;
}
function selP(name,e){
  if(name==='All'){selPersons.clear()}
  else if(e.shiftKey){selPersons.has(name)?selPersons.delete(name):selPersons.add(name)}
  else{if(selPersons.size===1&&selPersons.has(name))selPersons.clear();else{selPersons.clear();selPersons.add(name);}}
  renderChips();applyDim();
}
function isActive(t){return selPersons.size===0||t.o.some(o=>selPersons.has(o))}
function applyDim(){
  document.querySelectorAll('.task-row-wrap').forEach(w=>{
    const t=JSON.parse(w.dataset.task||'{}');
    w.classList.toggle('dimmed',!isActive(t));
  });
}

// ─── HEADER ──────────────────────────────────────────────────────────────────
function renderHeader(){
  const gw=gridW();
  let msh='';
  for(const m of MS_DATA){
    const x=dayX(m.d);
    const dateStr=fmtD(m.d);
    const isFin=!!m.final;
    msh+=`<div class="ms-pin" style="left:${x}px">
      <div class="ms-dia" style="background:${isFin?'#D85A30':'#6B7280'}"></div>
      <div class="ms-name${isFin?' fin':''}">${m.lbl}</div>
      <div class="ms-date${isFin?' fin':''}">${dateStr}</div>
    </div>`;
  }
  document.getElementById('ms-row').innerHTML=msh;
  document.getElementById('ms-row').style.width=gw+'px';

  let mh='';
  for(const m of MONTHS){
    const w=m.n*DAY_W;
    mh+=`<div style="width:${w}px;min-width:${w}px;background:${m.bg};border-right:1.5px solid #D1D5DB;display:flex;align-items:center;padding:0 10px;gap:5px;flex-shrink:0;overflow:hidden">
      <span style="font-size:12px;font-weight:700;color:${m.fg};white-space:nowrap">${m.label}</span>
      <span style="font-size:10px;color:${m.fg};opacity:.55">(${m.n}d)</span>
    </div>`;
  }
  document.getElementById('month-row').innerHTML=mh;

  // compute today's day offset
  const todayMs=new Date();todayMs.setHours(0,0,0,0);
  const todayD=Math.round((todayMs.getTime()-GRID_MS)/86400000);

  let dh='';
  for(const m of MONTHS){
    for(let i=0;i<m.n;i++){
      const d=m.s+i;
      const dn=new Date(GRID_MS+d*86400000).getDate();
      const we=isWE(d),mo=isMon(d),last=i===m.n-1;
      const isToday=d===todayD;
      // today: red circle around the number
      const numEl=isToday
        ?`<span style="display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#EF4444;color:#fff;font-size:9px;font-weight:700;line-height:1">${dn}</span>`
        :`${dn}`;
      dh+=`<div data-col="${d}" style="width:${DAY_W}px;min-width:${DAY_W}px;flex-shrink:0;height:24px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:${we?500:600};color:${we?'#94A3B8':'#6B7280'};background:${we?'rgba(148,163,184,.09)':'#fff'};border-left:${mo?'1.5px solid #D1D5DB':'0.5px solid #F3F4F6'};${last?'border-right:1.5px solid #D1D5DB;':''}user-select:none;transition:background .08s,color .08s">${numEl}</div>`;
    }
  }
  document.getElementById('day-row').innerHTML=dh;

  // col hover — highlight both the day cell and the grid column
  document.getElementById('day-row').addEventListener('mouseover',e=>{
    const cell=e.target.closest('[data-col]');
    if(!cell)return;
    const d=parseInt(cell.dataset.col);
    showColHighlight(d);
  });
  document.getElementById('day-row').addEventListener('mouseleave',()=>hideColHighlight());
}

// ─── GRID BG ─────────────────────────────────────────────────────────────────
function gridBg(){
  let out='';
  for(const m of MONTHS){
    for(let i=0;i<m.n;i++){
      const d=m.s+i;
      const x=dayX(d);
      if(isWE(d)) out+=`<div style="position:absolute;top:0;bottom:0;left:${x}px;width:${DAY_W}px;background:rgba(148,163,184,.07);pointer-events:none"></div>`;
      if(isMon(d)) out+=`<div style="position:absolute;top:0;bottom:0;left:${x}px;width:0;border-left:1.5px solid #E5E7EB;pointer-events:none"></div>`;
      if(i===m.n-1) out+=`<div style="position:absolute;top:0;bottom:0;left:${x+DAY_W}px;width:0;border-left:1.5px solid #D1D5DB;pointer-events:none"></div>`;
    }
  }
  return out;
}

// ─── BODY ────────────────────────────────────────────────────────────────────
function renderBody(){
  const gw=gridW();
  let lh='',rh='';

  for(const grp of GROUPS){
    const col=collapsed.has(grp.name);
    lh+=`<div class="grp-hdr-l" style="border-left:3px solid ${grp.color}" onclick="toggleGrp('${grp.name}')">
      <span style="font-size:11px;color:#6B7280;transition:transform .15s;transform:rotate(${col?'-90':'0'}deg)">▾</span>
      <span class="grp-dot" style="background:${grp.color}"></span>
      <span style="font-size:12px;font-weight:700;color:#1F2937">${grp.name}</span>
      ${col?`<span style="font-size:10px;color:#9CA3AF">(${grp.tasks.length})</span>`:''}
    </div>`;
    rh+=`<div class="grp-hdr-r" style="width:${gw}px;min-width:${gw}px">${gridBg()}</div>`;

    if(!col){
      for(const task of grp.tasks){
        const bc=task.conflict?'#E24B4A':TC[task.track]||grp.color;
        const x1=dayX(task.s),x2=dayX(task.e);
        const bw=Math.max(x2-x1,4),bt=(ROW_H-BAR_H)/2;
        const wide=bw>70;
        const tdata=JSON.stringify(task).replace(/"/g,'&quot;');
        lh+=`<div class="task-l${task.conflict?' conflict-row':''}">
          <div class="task-name-r">
            ${task.conflict?`<span style="font-size:11px;color:#E24B4A">⚠</span>`:''}
            <span class="tlbl" title="${task.name}">${task.name}</span>
          </div>
          <div class="avstack">${avStack(task.o,20)}</div>
        </div>`;
        rh+=`<div class="task-row-wrap${isActive(task)?'':' dimmed'}" data-task="${tdata}" style="height:${ROW_H}px;position:relative;flex-shrink:0"
          onmouseenter="showColHighlightFromRow(event)" onmousemove="showColHighlightFromRow(event)" onmouseleave="hideColHighlight()">
          <div class="task-r" style="width:${gw}px;min-width:${gw}px;height:${ROW_H}px">
            ${gridBg()}
            ${task.conflict?`<div class="conf-ring" style="left:${x1-3}px;top:${bt-3}px;width:${bw+6}px;height:${BAR_H+6}px"></div>`:''}
            <div class="bar" style="left:${x1}px;top:${bt}px;width:${bw}px;background:${bc};padding-right:${task.conflict?22:8}px" onclick="openCard('${task.id}',event)">
              ${wide?`<span class="bar-lbl">${task.name}</span>`:''}
              ${task.conflict?`<span class="bar-wi">⚠</span>`:''}
            </div>
            ${!wide?`<div class="out-lbl" style="left:${x1+bw+5}px;top:${bt}px;height:${BAR_H}px">${task.name}</div>`:''}
          </div>
        </div>`;
      }
    }
  }
  const msL=MS_DATA.map(m=>`<div class="ms-vl${m.final?' fin':''}" style="left:${dayX(m.d)}px"></div>`).join('');
  document.getElementById('left-body').innerHTML=lh;
  // preserve col-highlight div
  document.getElementById('right-body').innerHTML=
    `<div id="col-highlight" style="position:absolute;top:0;bottom:0;width:${DAY_W}px;background:rgba(55,138,221,.07);pointer-events:none;z-index:1;display:none"></div>`+
    `<div style="position:absolute;top:0;left:0;width:${gw}px;height:100%;pointer-events:none;z-index:2">${msL}</div>`+
    `<div style="position:relative;z-index:3">${rh}</div>`;
}

// ─── COL HOVER ───────────────────────────────────────────────────────────────
let _lastHoveredCol=null;
function showColHighlight(dayIndex){
  // grid body stripe
  const el=document.getElementById('col-highlight');
  if(el){el.style.left=dayX(dayIndex)+'px';el.style.display='block';}
  // day header cell
  if(_lastHoveredCol!==null&&_lastHoveredCol!==dayIndex){
    _clearDayCell(_lastHoveredCol);
  }
  _lastHoveredCol=dayIndex;
  const cell=document.querySelector(`#day-row [data-col="${dayIndex}"]`);
  if(cell){
    const isToday=cell.querySelector('span[style*="border-radius:50%"]');
    if(!isToday){
      cell.style.background='rgba(55,138,221,.13)';
      cell.style.color='#185FA5';
      cell.style.fontWeight='700';
    }
  }
}
function _clearDayCell(dayIndex){
  const cell=document.querySelector(`#day-row [data-col="${dayIndex}"]`);
  if(!cell)return;
  const isToday=cell.querySelector('span[style*="border-radius:50%"]');
  if(isToday)return; // never reset today cell
  const d=parseInt(cell.dataset.col);
  const we=isWE(d);
  cell.style.background=we?'rgba(148,163,184,.09)':'#fff';
  cell.style.color=we?'#94A3B8':'#6B7280';
  cell.style.fontWeight=we?'500':'600';
}
function hideColHighlight(){
  const el=document.getElementById('col-highlight');if(el)el.style.display='none';
  if(_lastHoveredCol!==null){_clearDayCell(_lastHoveredCol);_lastHoveredCol=null;}
}

function showColHighlightFromRow(e){
  const rb=document.getElementById('right-body');if(!rb)return;
  const rect=rb.getBoundingClientRect();
  const scrollX=document.getElementById('right-scroll').scrollLeft;
  const relX=e.clientX-rect.left+scrollX;
  const day=Math.floor(relX/DAY_W);
  if(day>=0&&day<TOTAL_DAYS)showColHighlight(day);
}
let showMilestone=true;
function toggleRowTab(name){
  if(name==='milestone'){
    showMilestone=!showMilestone;
    document.getElementById('rt-milestone').classList.toggle('on',showMilestone);
    const msRow=document.getElementById('ms-row');
    const lhdr=document.getElementById('left-header');
    if(showMilestone){
      msRow.classList.remove('hidden');
      msRow.style.height='56px';
      lhdr.style.height='108px';
      lhdr.classList.remove('ms-hidden');
    } else {
      msRow.classList.add('hidden');
      msRow.style.height='0';
      lhdr.style.height='52px';
      lhdr.classList.add('ms-hidden');
    }
    setTimeout(setH,220);
  }
}

function toggleGrp(name){collapsed.has(name)?collapsed.delete(name):collapsed.add(name);renderBody();}

// ─── SCROLL SYNC ─────────────────────────────────────────────────────────────
function setupSync(){
  const lb=document.getElementById('left-body'),rb=document.getElementById('right-body');
  let busy=false;
  lb.addEventListener('scroll',()=>{if(!busy){busy=true;rb.scrollTop=lb.scrollTop;busy=false;}},{passive:true});
  rb.addEventListener('scroll',()=>{if(!busy){busy=true;lb.scrollTop=rb.scrollTop;busy=false;}},{passive:true});
}
function setH(){
  const topH=document.getElementById('topbar').offsetHeight;
  const h=window.innerHeight-topH;
  document.getElementById('gantt-shell').style.height=h+'px';
  const lh=document.getElementById('left-header').offsetHeight;
  const rh=document.getElementById('right-header').offsetHeight;
  document.getElementById('left-body').style.height=(h-lh)+'px';
  document.getElementById('left-body').style.overflowY='hidden';
  document.getElementById('right-body').style.height=(h-rh)+'px';
  document.getElementById('right-body').style.overflowY='auto';
}

// ─── CARD ────────────────────────────────────────────────────────────────────
function openCard(id,e){
  e.stopPropagation();
  const task=getTask(id);if(!task)return;
  const grp=getGroup(id);
  const bc=task.conflict?'#E24B4A':TC[task.track]||'#888';
  const rect=e.currentTarget.getBoundingClientRect();
  const CW=340;
  let left=rect.left+rect.width/2-CW/2;
  left=Math.max(8,Math.min(left,window.innerWidth-CW-8));
  const top=window.innerHeight-rect.bottom>300?rect.bottom+8:rect.top-460;
  document.getElementById('c-acc').style.background=bc;
  document.getElementById('card').style.top=Math.max(8,top)+'px';
  document.getElementById('card').style.left=left+'px';
  const pills=task.o.map(o=>{
    const p=pData(o);
    return `<span style="display:inline-flex;align-items:center;gap:5px;padding:3px 8px 3px 3px;border-radius:999px;font-size:11px;font-weight:500;background:${p.color}15;border:1.5px solid ${p.color}30;color:${p.color}">
      <span class="av" style="width:18px;height:18px;min-width:18px;font-size:7px;background:${p.color};border:none">${p.initials}</span>${o}
    </span>`;
  }).join('');
  document.getElementById('c-inner').innerHTML=`
    <div style="font-size:10px;font-weight:700;letter-spacing:.07em;border-radius:4px;padding:2px 7px;text-transform:uppercase;display:inline-block;margin-bottom:10px;color:${bc};background:${bc}18">${task.conflict?'⚠ CONFLICT · ':''}${task.track}</div>
    <div style="font-size:15px;font-weight:600;color:#1F2937;margin-bottom:8px;line-height:1.3">${task.name}</div>
    <div style="color:#6B7280;line-height:1.6;font-size:12px;margin-bottom:12px">${task.goal||'—'}</div>
    <div style="font-size:10px;font-weight:700;color:#9CA3AF;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px">Owners</div>
    <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px">${pills}</div>
    <div style="text-align:right;margin-top:8px">
      <span style="font-size:10px;font-weight:600;color:#9CA3AF;text-transform:uppercase;display:block;margin-bottom:1px">Duration</span>
      <span style="font-size:11px;color:#374151;font-weight:500">${fmtD(task.s)} → ${fmtD(task.e)}</span>
    </div>
    ${task.conflict?`<div style="margin-top:10px;background:#FEF2F2;border:1px solid #FECACA;border-radius:6px;padding:8px 10px;font-size:11px;color:#B91C1C;line-height:1.5">⚠ Jah is assigned to both overlapping tasks on 12 Aug — confirm sequence before release.</div>`:''}
  `;
  document.getElementById('card').style.display='flex';
  document.getElementById('card-ov').style.display='block';
}
function closeCard(){document.getElementById('card').style.display='none';document.getElementById('card-ov').style.display='none';}

// ─── MILESTONES TAB ──────────────────────────────────────────────────────────
let msEditId=null;   // id of milestone being inline-edited
let msDelConfirm=null; // id of milestone showing delete confirm

function renderMilestonesTab(){
  const body=document.getElementById('mp-body');

  // ── Create form ──
  const createForm=`
    <div class="form-card" id="ms-create-form" style="margin-bottom:20px">
      <h3>Add Milestone</h3>
      <div class="grid2" style="margin-bottom:12px">
        <div style="grid-column:1/-1">
          <div class="fld-lbl">Name *</div>
          <input id="ms-new-name" placeholder="e.g. UAT Sign-off">
        </div>
        <div>
          <div class="fld-lbl">Date *</div>
          <input type="date" id="ms-new-date" value="${d2date(MS_DATA.length>0?MS_DATA[MS_DATA.length-1].d+7:0)}" min="2026-06-04" max="2026-12-31">
        </div>
        <div style="display:flex;align-items:flex-end;padding-bottom:1px">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:#374151;user-select:none">
            <input type="checkbox" id="ms-new-final" style="width:auto;accent-color:#D85A30">
            Mark as final delivery
          </label>
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end">
        <button class="btn-save" onclick="createMilestone()">+ Add Milestone</button>
      </div>
    </div>`;

  // ── List rows ──
  const rows=MS_DATA.map((m,i)=>{
    const isFin=!!m.final;
    const isEdit=msEditId===m.id;
    const isDel=msDelConfirm===m.id;
    const bg=i%2===0?'#fff':'#FAFAFA';

    if(isEdit){
      return `<tr id="mrow-${m.id}" style="background:#F0F6FF">
        <td style="width:20px;padding:10px 4px 10px 14px">
          <div style="width:10px;height:10px;border-radius:2px;transform:rotate(45deg);background:${isFin?'#D85A30':'#6B7280'};margin:0 auto"></div>
        </td>
        <td style="padding:8px 10px">
          <input id="ms-edit-name-${m.id}" value="${m.lbl.replace(/"/g,'&quot;')}" style="font-size:12px;margin-bottom:0">
        </td>
        <td style="padding:8px 10px;white-space:nowrap">
          <input type="date" id="ms-edit-date-${m.id}" value="${d2date(m.d)}" min="2026-06-04" max="2026-12-31" style="font-size:12px;padding:5px 8px">
        </td>
        <td style="padding:8px 10px">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:11px;color:#374151;white-space:nowrap;user-select:none">
            <input type="checkbox" id="ms-edit-final-${m.id}" ${isFin?'checked':''} style="width:auto;accent-color:#D85A30">Final
          </label>
        </td>
        <td style="padding:8px 10px;white-space:nowrap;text-align:right">
          <div style="display:flex;gap:6px;justify-content:flex-end">
            <button class="btn-cancel" style="padding:4px 10px;font-size:11px" onclick="msEditId=null;renderMilestonesTab()">Cancel</button>
            <button class="btn-save" style="padding:4px 12px;font-size:11px" onclick="saveMilestone('${m.id}')">✓ Save</button>
          </div>
        </td>
      </tr>`;
    }

    if(isDel){
      return `<tr id="mrow-${m.id}" style="background:#FEF2F2">
        <td style="width:20px;padding:10px 4px 10px 14px">
          <div style="width:10px;height:10px;border-radius:2px;transform:rotate(45deg);background:#E24B4A;margin:0 auto"></div>
        </td>
        <td colspan="3" style="padding:10px;font-size:12px;color:#B91C1C;font-weight:600">Delete "${m.lbl}"? This cannot be undone.</td>
        <td style="padding:8px 10px;text-align:right;white-space:nowrap">
          <div style="display:flex;gap:6px;justify-content:flex-end">
            <button class="confirm-no" onclick="msDelConfirm=null;renderMilestonesTab()">Cancel</button>
            <button class="confirm-yes" onclick="deleteMilestone('${m.id}')">Yes, delete</button>
          </div>
        </td>
      </tr>`;
    }

    return `<tr id="mrow-${m.id}" style="background:${bg};transition:background .1s"
      onmouseenter="this.style.background='#F9FAFB'" onmouseleave="this.style.background='${bg}'">
      <td style="width:20px;padding:10px 4px 10px 14px">
        <div style="width:10px;height:10px;border-radius:2px;transform:rotate(45deg);background:${isFin?'#D85A30':'#6B7280'};margin:0 auto"></div>
      </td>
      <td style="padding:10px">
        <div style="font-weight:600;color:${isFin?'#D85A30':'#1F2937'};font-size:13px">${m.lbl}</div>
      </td>
      <td style="padding:10px;white-space:nowrap">
        <span style="display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:500;background:${isFin?'#FEF3EE':'#F3F4F6'};color:${isFin?'#D85A30':'#374151'}">
          📅 ${fmtD(m.d)}
        </span>
      </td>
      <td style="padding:10px">
        ${isFin?`<span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:#D85A3018;color:#D85A30">Final</span>`:''}
      </td>
      <td style="padding:10px;text-align:right;white-space:nowrap">
        <div style="display:flex;gap:4px;justify-content:flex-end;opacity:0;transition:opacity .12s" class="ms-actions">
          <button onclick="msEditId='${m.id}';msDelConfirm=null;renderMilestonesTab()"
            style="background:none;border:1px solid #E5E7EB;cursor:pointer;color:#6B7280;font-size:11px;padding:3px 10px;border-radius:6px"
            onmouseenter="this.style.background='#F3F4F6'" onmouseleave="this.style.background='none'">Edit</button>
          <button onclick="msDelConfirm='${m.id}';msEditId=null;renderMilestonesTab()"
            style="background:none;border:none;cursor:pointer;color:#D1D5DB;font-size:15px;padding:3px 6px;border-radius:6px;line-height:1"
            onmouseenter="this.style.color='#EF4444';this.style.background='#FEF2F2'" onmouseleave="this.style.color='#D1D5DB';this.style.background='none'">···</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  body.innerHTML=createForm+`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div style="font-size:15px;font-weight:700;color:#1F2937">All milestones
        <span style="font-size:11px;font-weight:400;color:#9CA3AF;margin-left:6px">${MS_DATA.length} total</span>
      </div>
    </div>
    <div class="tbl-wrap">
      <table id="ms-table">
        <thead><tr><th style="width:24px"></th><th>Name</th><th>Date</th><th>Type</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;

  // show action buttons on row hover
  body.querySelectorAll('#ms-table tbody tr').forEach(tr=>{
    const acts=tr.querySelector('.ms-actions');
    if(!acts)return;
    tr.addEventListener('mouseenter',()=>acts.style.opacity='1');
    tr.addEventListener('mouseleave',()=>acts.style.opacity='0');
  });
}

function createMilestone(){
  const name=(document.getElementById('ms-new-name').value||'').trim();
  if(!name){document.getElementById('ms-new-name').focus();return;}
  const dateVal=document.getElementById('ms-new-date').value;
  if(!dateVal)return;
  const d=date2d(dateVal);
  const final=document.getElementById('ms-new-final').checked||undefined;
  MS_DATA.push({id:'ms-'+Date.now(),lbl:name,d,final:final||undefined});
  MS_DATA.sort((a,b)=>a.d-b.d);
  renderHeader();renderBody();renderMilestonesTab();
}

function saveMilestone(id){
  const m=MS_DATA.find(x=>x.id===id);if(!m)return;
  const name=(document.getElementById('ms-edit-name-'+id).value||'').trim();
  if(!name)return;
  m.lbl=name;
  m.d=date2d(document.getElementById('ms-edit-date-'+id).value);
  m.final=document.getElementById('ms-edit-final-'+id).checked||undefined;
  MS_DATA.sort((a,b)=>a.d-b.d);
  msEditId=null;
  renderHeader();renderBody();renderMilestonesTab();
}

function deleteMilestone(id){
  MS_DATA=MS_DATA.filter(m=>m.id!==id);
  msDelConfirm=null;
  renderHeader();renderBody();renderMilestonesTab();
}

          Edit
        </button>
      </div>
    </td>
  </tr>`;
}

function renderTasksTab(){
  if(mpTaskSel){renderTaskDetail();return;}
  const body=document.getElementById('mp-body');
  const all=allTasks();
  const rows=all.map((t,i)=>taskRowHTML(t,i)).join('');
  body.innerHTML=`<div style="display:flex;gap:10px;margin-bottom:16px">
    <div class="search-wrap"><span class="search-icon">🔍</span><input placeholder="Search tasks…" oninput="filterTasks(this.value)" id="task-search"></div>
    <button class="btn-dark" onclick="showNewTaskForm()">+ New Task</button>
  </div>
  <div id="task-form-area"></div>
  <div class="tbl-wrap"><table><thead><tr><th>Task</th><th>Group</th><th>Owners</th><th>Dates</th><th></th></tr></thead><tbody id="task-tbody">${rows}</tbody></table></div>`;
}
function filterTasks(q){
  const all=allTasks();
  const filtered=all.filter(t=>t.name.toLowerCase().includes(q.toLowerCase())||t.groupName.toLowerCase().includes(q.toLowerCase()));
  document.getElementById('task-tbody').innerHTML=filtered.map((t,i)=>taskRowHTML(t,i)).join('');
}
function selTask(id){mpTaskSel=id;renderMp();}

function quickPreviewTask(id){
  const task=getTask(id);if(!task)return;
  const grp=getGroup(id);
  const bc=task.conflict?'#E24B4A':TC[task.track]||(grp&&grp.color)||'#888';

  // remove any existing preview
  const old=document.getElementById('task-quick-preview');if(old)old.remove();

  const pills=task.o.map(o=>{
    const p=pData(o);
    return `<span style="display:inline-flex;align-items:center;gap:4px;padding:2px 8px 2px 3px;border-radius:999px;font-size:11px;font-weight:500;background:${p.color}15;border:1.5px solid ${p.color}30;color:${p.color}">
      <span style="width:16px;height:16px;border-radius:50%;background:${p.color};display:inline-flex;align-items:center;justify-content:center;font-size:7px;font-weight:800;color:#fff">${p.initials}</span>${o}
    </span>`;
  }).join('');

  const subs=task.subtasks||[];
  const sprintObj=SPRINTS.find(s=>s.id===task.sprintId);

  const el=document.createElement('div');
  el.id='task-quick-preview';
  el.style.cssText='position:fixed;top:0;right:720px;bottom:0;width:320px;background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,.10);z-index:202;display:flex;flex-direction:column;animation:slideInLeft .18s ease;overflow:hidden';
  el.innerHTML=`
    <style>@keyframes slideInLeft{from{transform:translateX(100%);opacity:.5}to{transform:none;opacity:1}}</style>
    <div style="height:4px;background:${bc};flex-shrink:0"></div>

          <div style="font-size:9px;font-weight:700;color:#9CA3AF;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px">Start</div>
          <div style="font-size:12px;font-weight:600;color:#1F2937">📅 ${fmtD(task.s)}</div>
        </div>
        <div style="background:#F9FAFB;border-radius:8px;padding:8px 10px">
          <div style="font-size:9px;font-weight:700;color:#9CA3AF;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px">End</div>
          <div style="font-size:12px;font-weight:600;color:#1F2937">📅 ${fmtD(task.e)}</div>

      </div>

      <div style="margin-bottom:14px">
        <div style="font-size:9px;font-weight:700;color:#9CA3AF;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Owners</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px">${pills}</div>

      ${sprintObj?`<div style="margin-bottom:14px">
        <div style="font-size:9px;font-weight:700;color:#9CA3AF;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Sprint</div>
        <span style="display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 6px;border-radius:999px;background:${sprintObj.color}15;border:1.5px solid ${sprintObj.color}30">
          <span style="width:7px;height:7px;border-radius:50%;background:${sprintObj.color}"></span>
          <span style="font-size:11px;font-weight:600;color:${sprintObj.color}">${sprintObj.name}</span>
        </span>
      </div>`:''}

      ${task.conflict?`<div style="background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;padding:8px 10px;margin-bottom:14px;font-size:11px;color:#B91C1C">⚠ Conflict — Jah has overlapping tasks on 12 Aug</div>`:''}

      </button>
      <button onclick="document.getElementById('task-quick-preview').remove()"
        style="padding:8px 14px;border-radius:8px;border:1px solid #E5E7EB;background:#fff;color:#6B7280;font-size:12px;cursor:pointer">Close</button>
    </div>`;

  document.body.appendChild(el);

  // close when clicking outside (on the overlay)
  setTimeout(()=>{
    document.addEventListener('click', function handler(e){
      const preview=document.getElementById('task-quick-preview');
      if(preview&&!preview.contains(e.target)&&!e.target.closest('[data-tid]')){
        preview.remove();
        document.removeEventListener('click',handler);
      }
    });
  },100);
}

      <div><div class="fld-lbl">End Date</div><input type="date" id="nt-end" value="${d2date(13)}" min="2026-06-04" max="2026-08-25"></div>
    </div>
    <div style="margin-bottom:10px"><div class="fld-lbl">Assign *</div>${ownerPicker([],'nt-owners')}</div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn-cancel" onclick="document.getElementById('task-form-area').innerHTML=''">Cancel</button>
      <button class="btn-save" onclick="createTask()">Create</button>
    </div>
  </div>`;
}
function createTask(){
  const name=document.getElementById('nt-name').value.trim();
  const grpName=document.getElementById('nt-group').value;
  const s=date2d(document.getElementById('nt-start').value);
  const e=date2d(document.getElementById('nt-end').value);
  const owners=getOwners('nt-owners');
  if(!name){alert('Task name is required');return;}
  if(!owners.length){alert('Assign at least one owner');return;}
  const grp=GROUPS.find(g=>g.name===grpName);
  const trackMap={'CMS':'CMS','Mobile':'Mobile','UAT / QA':'QA'};
  const task={id:'t-'+Date.now(),name,track:trackMap[grpName]||'QA',o:owners,s,e,goal:'',conflict:false};
  if(grp)grp.tasks.push(task);
  renderMp();renderBody();
}

// ─── TASK DETAIL ─────────────────────────────────────────────────────────────
let expandedSubId=null; // which subtask card is currently open

function renderTaskDetail(){
  const task=getTask(mpTaskSel);if(!task)return;
  const grp=getGroup(mpTaskSel);
  const bc=task.conflict?'#E24B4A':TC[task.track]||(grp&&grp.color)||'#888';
  const body=document.getElementById('mp-body');
  const subs=task.subtasks||[];

  // Subtask collapsed view (click to expand)
  function subCollapsed(s,i){
    const sprintObj=SPRINTS.find(x=>x.id===s.sprintId);
    return `<div id="sc-${s.id}" style="padding:14px 16px;${i>0?'border-top:1px solid #F3F4F6;':''}background:#fff;cursor:pointer;transition:background .1s"
      onmouseenter="this.style.background='#F9FAFB'" onmouseleave="this.style.background='#fff'"
      onclick="expandSub('${task.id}','${s.id}')">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600;color:#1F2937">${s.name}</div>
          <div style="display:flex;align-items:center;gap:12px;margin-top:4px;flex-wrap:wrap">
            ${s.description?`<span style="font-size:11px;color:#6B7280;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px">${s.description}</span>`:''}
            ${(s.startDay!==undefined)?`<span style="font-size:11px;color:#9CA3AF">📅 ${fmtD(s.startDay)} → ${fmtD(s.endDay)}</span>`:''}
            ${sprintObj?`<span style="font-size:10px;font-weight:600;padding:1px 7px;border-radius:999px;background:${sprintObj.color}18;color:${sprintObj.color}">${sprintObj.name}</span>`:''}
            ${s.owners&&s.owners.length?`<div style="display:flex;gap:-2px">${s.owners.map(o=>avH(o,18)).join('')}</div>`:''}
          </div>
        </div>
        <span style="font-size:11px;color:#D1D5DB">›</span>
      </div>
    </div>`;
  }

  // Subtask expanded/edit view
  function subExpanded(s,i){
    const sprintSel=SPRINTS.length?`<div><div class="fld-lbl">Sprint</div><select id="se-sprint-${s.id}" style="background:#fff">
      <option value="">— No sprint —</option>
      ${SPRINTS.map(sp=>`<option value="${sp.id}"${s.sprintId===sp.id?' selected':''}>${sp.name}</option>`).join('')}
    </select></div>`:'';
    return `<div id="sc-${s.id}" style="padding:16px;${i>0?'border-top:1px solid #E5E7EB;':''}background:#F9FAFB;border-radius:8px;margin:6px 0">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <span style="font-size:12px;font-weight:700;color:#9CA3AF;text-transform:uppercase;letter-spacing:.05em">Edit subtask</span>
        <div style="display:flex;gap:6px">
          <button class="btn-del" onclick="confirmDelSub('${task.id}','${s.id}')">🗑 Delete</button>
          <button class="btn-cancel" onclick="expandedSubId=null;renderTaskDetail()" style="padding:4px 10px;font-size:11px">✕ Close</button>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div><div class="fld-lbl">Name *</div><input id="se-name-${s.id}" value="${s.name.replace(/"/g,'&quot;').replace(/'/g,'&#39;')}"></div>
        <div><div class="fld-lbl">Description</div><textarea id="se-desc-${s.id}" rows="2">${s.description||''}</textarea></div>
        <div class="grid2">
          <div><div class="fld-lbl">Start</div><input type="date" id="se-start-${s.id}" value="${s.startDay!==undefined?d2date(s.startDay):d2date(0)}" min="2026-06-04" max="2026-08-25"></div>
          <div><div class="fld-lbl">End</div><input type="date" id="se-end-${s.id}" value="${s.endDay!==undefined?d2date(s.endDay):d2date(7)}" min="2026-06-04" max="2026-08-25"></div>
        </div>
        <div><div class="fld-lbl">Assignee</div>${ownerPicker(s.owners||[],'se-owners-'+s.id)}</div>
        ${sprintSel}
      </div>
      <div id="se-del-confirm-${s.id}"></div>
      <div style="display:flex;justify-content:flex-end;margin-top:14px">
        <button class="btn-save" onclick="saveSubtask('${task.id}','${s.id}')">✓ Save subtask</button>
      </div>
    </div>`;
  }

  const subCards=subs.map((s,i)=>expandedSubId===s.id?subExpanded(s,i):subCollapsed(s,i)).join('');

  body.innerHTML=`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <button class="back-btn" onclick="mpTaskSel=null;expandedSubId=null;renderMp()">← Back</button>
      <div style="flex:1;min-width:0">
        <div style="font-size:15px;font-weight:800;color:#111827;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${task.name}</div>
        <div style="font-size:11px;color:#9CA3AF;margin-top:1px">${grp?grp.name:''}</div>
      </div>
    </div>
    <div id="del-confirm-area"></div>

    <!-- Details section -->
    <div style="display:flex;border-bottom:1px solid #E5E7EB;margin-bottom:20px">
      <span style="padding:8px 16px;font-size:13px;font-weight:700;color:#1F2937;border-bottom:2px solid ${bc};margin-bottom:-1px">Details</span>
    </div>

    <div style="display:flex;flex-direction:column;gap:16px;margin-bottom:8px">
      <div><div class="fld-lbl">Task Name *</div><input id="dt-name" value="${task.name.replace(/"/g,'&quot;').replace(/'/g,'&#39;')}" onfocus="this.style.borderColor='${bc}'" onblur="this.style.borderColor=''" oninput="markDirty()"></div>
      <div><div class="fld-lbl">Goal</div><textarea id="dt-goal" rows="3" onfocus="this.style.borderColor='${bc}'" onblur="this.style.borderColor=''" oninput="markDirty()">${task.goal||''}</textarea></div>
      <div class="grid2">
        <div><div class="fld-lbl">Start</div><input type="date" id="dt-start" value="${d2date(task.s)}" min="2026-06-04" max="2026-08-25" oninput="markDirty()"></div>
        <div><div class="fld-lbl">End</div><input type="date" id="dt-end" value="${d2date(task.e)}" min="2026-06-04" max="2026-08-25" oninput="markDirty()"></div>
      </div>
      <div><div class="fld-lbl">Owners *</div>${ownerPicker(task.o,'dt-owners')}</div>
      <div style="display:flex;align-items:center;justify-content:space-between" id="save-area-wrap">
        <button class="btn-del" style="font-size:11px" onclick="confirmDelTask('${task.id}')">🗑 Delete task</button>
        <div id="save-area"></div>
      </div>
    </div>

    <!-- Subtasks section -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px">
      <span style="font-size:15px;font-weight:700;color:#1F2937">Subtask${subs.length?` <span style="font-size:11px;font-weight:500;color:#9CA3AF;background:#F3F4F6;border-radius:10px;padding:1px 8px;margin-left:4px">${subs.length}</span>`:''}</span>
      <button class="btn-outline" onclick="showSubForm('${task.id}')">+ Add subtask</button>
    </div>
    <div id="sub-list" style="border:1px solid #E5E7EB;border-radius:10px;overflow:hidden">
      ${subs.length?subCards:`<div style="text-align:center;padding:28px 0;color:#D1D5DB;font-size:13px">No subtasks yet — click "+ Add subtask" to create one</div>`}
    </div>
    <div id="sub-form-area"></div>`;

  document.getElementById('dt-owners').querySelectorAll('.owner-toggle').forEach(b=>b.addEventListener('click',()=>setTimeout(markDirty,10)));
}

function expandSub(taskId,subId){
  expandedSubId=expandedSubId===subId?null:subId;
  renderTaskDetail();
  // scroll to expanded card
  setTimeout(()=>{const el=document.getElementById('sc-'+subId);if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'});},50);
}

function saveSubtask(taskId,subId){
  const task=getTask(taskId);if(!task||!task.subtasks)return;
  const sub=task.subtasks.find(s=>s.id===subId);if(!sub)return;
  const name=(document.getElementById('se-name-'+subId).value||'').trim();
  if(!name){alert('Name required');return;}
  sub.name=name;
  sub.description=(document.getElementById('se-desc-'+subId).value||'').trim();
  sub.startDay=date2d(document.getElementById('se-start-'+subId).value);
  sub.endDay=date2d(document.getElementById('se-end-'+subId).value);
  sub.owners=getOwners('se-owners-'+subId);
  const spEl=document.getElementById('se-sprint-'+subId);
  if(spEl)sub.sprintId=spEl.value||undefined;
  expandedSubId=null;
  renderTaskDetail();renderBody();
}

function confirmDelSub(taskId,subId){
  const el=document.getElementById('se-del-confirm-'+subId);if(!el)return;
  el.innerHTML=`<div style="background:#FEF2F2;border:1px solid #FECACA;border-radius:7px;padding:10px 12px;margin-top:10px">
    <div style="font-size:12px;font-weight:700;color:#B91C1C;margin-bottom:6px">Delete this subtask?</div>
    <div class="confirm-row">
      <button class="btn-cancel" onclick="this.closest('[id^=se-del]').innerHTML=''">Cancel</button>
      <button class="confirm-yes" onclick="doDelSub('${taskId}','${subId}')">Yes, delete</button>
    </div>
  </div>`;
}
function doDelSub(taskId,subId){
  const task=getTask(taskId);if(!task||!task.subtasks)return;
  task.subtasks=task.subtasks.filter(s=>s.id!==subId);
  expandedSubId=null;renderTaskDetail();renderBody();
}

function markDirty(){
  const sa=document.getElementById('save-area');if(!sa)return;
  const task=getTask(mpTaskSel);if(!task)return;
  const grp=getGroup(mpTaskSel);
  const bc=task.conflict?'#E24B4A':TC[task.track]||(grp&&grp.color)||'#888';
  sa.innerHTML=`<button class="btn-save" style="background:${bc}" onclick="saveTaskDetail()">✓ Save changes</button>`;
}
function saveTaskDetail(){
  const task=getTask(mpTaskSel);if(!task)return;
  const name=(document.getElementById('dt-name').value||'').trim();
  if(!name){alert('Task name required');return;}
  const goal=document.getElementById('dt-goal').value;
  const s=date2d(document.getElementById('dt-start').value);
  const e=date2d(document.getElementById('dt-end').value);
  const owners=getOwners('dt-owners');
  task.name=name;task.goal=goal;task.s=s;task.e=e;if(owners.length)task.o=owners;
  document.getElementById('save-area').innerHTML='';
  renderBody();renderMp();renderChips();
}
function confirmDelTask(id){
  document.getElementById('del-confirm-area').innerHTML=`<div style="background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;padding:12px 14px;margin-bottom:14px">
    <div style="font-size:13px;font-weight:700;color:#B91C1C;margin-bottom:6px">Delete this task?</div>
    <div style="font-size:11px;color:#9CA3AF;margin-bottom:10px">This cannot be undone.</div>
    <div class="confirm-row">
      <button class="btn-cancel" onclick="document.getElementById('del-confirm-area').innerHTML=''">Cancel</button>
      <button class="confirm-yes" onclick="doDelTask('${id}')">Yes, delete</button>
    </div>
  </div>`;
}
function doDelTask(id){
  for(const g of GROUPS){g.tasks=g.tasks.filter(t=>t.id!==id);}
  expandedSubId=null;mpTaskSel=null;renderBody();renderMp();
}
function showSubForm(taskId){
  const sfa=document.getElementById('sub-form-area');if(!sfa)return;
  const sprintOpts=SPRINTS.length?`<div><div class="fld-lbl">Sprint</div><select id="sub-sprint" style="background:#fff">
    <option value="">— No sprint —</option>
    ${SPRINTS.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}
  </select></div>`:'';
  sfa.innerHTML=`<div class="form-card" style="margin-top:16px">
    <h3 style="margin-bottom:14px">New Subtask</h3>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div><div class="fld-lbl">Subtask Name *</div><input id="sub-name" placeholder="Subtask name…"></div>
      <div><div class="fld-lbl">Description</div><textarea id="sub-desc" rows="2" placeholder="Optional description…"></textarea></div>
      <div class="grid2">
        <div><div class="fld-lbl">Start Date</div><input type="date" id="sub-start" value="${d2date(0)}" min="2026-06-04" max="2026-08-25"></div>
        <div><div class="fld-lbl">End Date</div><input type="date" id="sub-end" value="${d2date(7)}" min="2026-06-04" max="2026-08-25"></div>
      </div>
      <div><div class="fld-lbl">Assignee</div>${ownerPicker([],'sub-owners')}</div>
      ${sprintOpts}
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
      <button class="btn-cancel" onclick="document.getElementById('sub-form-area').innerHTML=''">Cancel</button>
      <button class="btn-save" onclick="addSubtask('${taskId}')">✓ Add subtask</button>
    </div>
  </div>`;
}
function addSubtask(taskId){
  const task=getTask(taskId);if(!task)return;
  const name=(document.getElementById('sub-name').value||'').trim();
  if(!name){alert('Subtask name required');return;}
  const description=(document.getElementById('sub-desc').value||'').trim();
  const startDay=date2d(document.getElementById('sub-start').value);
  const endDay=date2d(document.getElementById('sub-end').value);
  const owners=getOwners('sub-owners');
  const spEl=document.getElementById('sub-sprint');
  const sprintId=spEl?spEl.value||undefined:undefined;
  if(!task.subtasks)task.subtasks=[];
  task.subtasks.push({id:'sub-'+Date.now(),name,description,startDay,endDay,owners,sprintId});
  expandedSubId=null;renderTaskDetail();renderBody();
}
function delSubtask(taskId,subId){
  const task=getTask(taskId);if(!task||!task.subtasks)return;
  task.subtasks=task.subtasks.filter(s=>s.id!==subId);
  expandedSubId=null;renderTaskDetail();renderBody();
}

// ─── SUBTASKS TAB ────────────────────────────────────────────────────────────
let subSprintFilter=null;

function renderSubtasksTab(){
  const body=document.getElementById('mp-body');
  const all=GROUPS.flatMap(g=>g.tasks.flatMap(t=>(t.subtasks||[]).map(s=>({...s,taskId:t.id,taskName:t.name,groupName:g.name,groupColor:g.color}))));

  const sprintChips=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:16px;flex-wrap:wrap;padding:10px 14px;background:#F9FAFB;border-radius:10px;border:1px solid #F3F4F6">
    <span style="font-size:10px;font-weight:700;color:#C4C8D0;letter-spacing:.07em;margin-right:2px">SPRINT</span>
    <button onclick="setSubSprintFilter(null)" style="display:inline-flex;align-items:center;padding:4px 12px;border-radius:999px;font-size:11px;font-weight:${subSprintFilter===null?700:500};cursor:pointer;border:1.5px solid ${subSprintFilter===null?'#1F2937':'#E5E7EB'};background:${subSprintFilter===null?'#1F2937':'#fff'};color:${subSprintFilter===null?'#fff':'#6B7280'};transition:all .12s">All</button>
    ${SPRINTS.map(s=>`<button onclick="setSubSprintFilter('${s.id}')" style="display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:${subSprintFilter===s.id?700:500};cursor:pointer;border:1.5px solid ${subSprintFilter===s.id?s.color:'#E5E7EB'};background:${subSprintFilter===s.id?s.color+'18':'#fff'};color:${subSprintFilter===s.id?s.color:'#6B7280'};transition:all .12s">
      <span style="width:7px;height:7px;border-radius:50%;background:${s.color};flex-shrink:0;display:inline-block"></span>${s.name}
    </button>`).join('')}
    ${SPRINTS.length===0?`<span style="font-size:11px;color:#D1D5DB;font-style:italic">No sprints yet — create them in the Sprint tab</span>`:''}
  </div>`;

  const filtered=subSprintFilter ? all.filter(s=>s.sprintId===subSprintFilter) : all;

  const rows=filtered.length===0
    ?`<tr><td colspan="5" style="padding:28px;text-align:center;color:#9CA3AF">${subSprintFilter?'No subtasks assigned to this sprint':'No subtasks yet — add them from a task detail view'}</td></tr>`
    :filtered.map((s,i)=>{
      const bg=i%2===0?'#fff':'#FAFAFA';
      const spObj=SPRINTS.find(x=>x.id===s.sprintId);
      return `<tr class="no-click" style="background:${bg}" onmouseenter="this.style.background='#F9FAFB'" onmouseleave="this.style.background='${bg}'">
        <td><div style="font-weight:600;color:#1F2937;font-size:12px">${s.name}</div>${s.description?`<div style="font-size:10px;color:#9CA3AF;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px">${s.description}</div>`:''}</td>
        <td style="color:#6B7280;font-size:12px">${s.taskName}</td>
        <td><span class="tag-pill" style="color:${s.groupColor};background:${s.groupColor}18;font-size:11px">${s.groupName}</span></td>
        <td>${spObj?`<span style="font-size:10px;font-weight:600;padding:2px 8px;border-radius:999px;background:${spObj.color}18;color:${spObj.color};white-space:nowrap">${spObj.name}</span>`:'<span style="color:#D1D5DB;font-size:11px">—</span>'}</td>
        <td><div style="display:flex;gap:2px">${(s.owners||[]).map(o=>avH(o,20)).join('')||'<span style="color:#D1D5DB;font-size:11px">—</span>'}</div></td>
      </tr>`;
    }).join('');

  body.innerHTML=sprintChips+`
  <div style="font-size:12px;color:#9CA3AF;margin-bottom:8px">${filtered.length} subtask${filtered.length!==1?'s':''}</div>
  <div class="tbl-wrap"><table>
    <thead><tr><th>Subtask</th><th>Task</th><th>Group</th><th>Sprint</th><th>Owners</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}
function setSubSprintFilter(id){subSprintFilter=id;renderSubtasksTab();}
function delSubtaskGlobal(taskId,subId){
  const task=getTask(taskId);if(!task||!task.subtasks)return;
  task.subtasks=task.subtasks.filter(s=>s.id!==subId);
  renderSubtasksTab();renderBody();
}

// ─── GROUPS TAB ──────────────────────────────────────────────────────────────
let ngColor=PRESET_COLORS[0];
let editingGroupName=null;
const _grpEditColors={};

function renderGroupsTab(){
  const body=document.getElementById('mp-body');
  body.innerHTML=`
    <div class="form-card" style="margin-bottom:16px">
      <h3>Add Group</h3>
      <div style="display:flex;gap:10px;align-items:flex-end;margin-bottom:12px">

          <div class="fld-lbl">Name</div>

        <button class="btn-save" onclick="addGroup()">+ Add</button>

function renderGroupList(){

      const ec=_grpEditColors[gid]||g.color;
      return `<div class="list-item" style="cursor:default;flex-direction:column;align-items:stretch;gap:10px" id="gedit-${gid}">
        <div style="display:flex;align-items:center;gap:10px">
          <span id="gedit-dot-${gid}" style="width:20px;height:20px;border-radius:5px;background:${ec};flex-shrink:0;display:inline-block"></span>
          <div style="flex:1">
            <div class="fld-lbl" style="margin-bottom:3px">Group Name</div>
            <input id="gedit-name-${gid}" value="${g.name.replace(/"/g,'&quot;').replace(/'/g,'&#39;')}" style="font-size:12px">
          </div>
        </div>
        <div>
          <div class="fld-lbl" style="margin-bottom:5px">Color</div>
          <div id="gedit-colors-${gid}">${_grpColorSwatches(gid,ec)}</div>
        </div>
        <div id="gdel-${gid}"></div>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <button class="btn-del" onclick="confirmDelGroup('${g.name}','${gid}')">🗑 Delete group</button>

            <button class="btn-save" style="padding:4px 12px;font-size:11px" onclick="saveGroup('${g.name}','${gid}')">✓ Save</button>
          </div>
        </div>
      </div>`;
    }
    return `<div class="list-item" style="cursor:default" id="grow-${gid}">
      <span style="width:14px;height:14px;border-radius:4px;background:${g.color};flex-shrink:0;display:inline-block"></span>
      <div style="flex:1">
        <div style="font-size:14px;font-weight:700;color:#1F2937">${g.name}</div>
        <div style="font-size:11px;color:#9CA3AF">${g.tasks.length} task${g.tasks.length!==1?'s':''}</div>
      </div>

// ── Role CRUD helpers ──
function _rId(r){return r.replace(/[^a-z0-9]/gi,'_')}
function _roleColorSwatches(role,sel){
  return ROLE_PRESET_COLORS.map(c=>`<button style="width:16px;height:16px;border-radius:50%;background:${c};border:${c===sel?'2.5px solid #1F2937':'2px solid transparent'};cursor:pointer;flex-shrink:0" onclick="setRoleEditColor('${_rId(role)}','${c}')"></button>`).join('');
}
const _roleEditColors={};
function setRoleEditColor(rId,c){
  _roleEditColors[rId]=c;
  const el=document.getElementById('redit-colors-'+rId);
  if(el) el.innerHTML=_roleColorSwatches(rId.replace(/_/g,' '),c); // visual update
  // update swatch selection
  el&&el.querySelectorAll('button').forEach(b=>{ b.style.borderColor=b.style.background===c?'#1F2937':'transparent'; });
}
function addRole(){
  const name=(document.getElementById('nr-name').value||'').trim();
  const err=document.getElementById('nr-err');
  if(!name){err.textContent='Name required';return;}
  if(ROLES.find(r=>r.toLowerCase()===name.toLowerCase())){err.textContent='Role already exists';return;}
  ROLES.push(name);
  const c=newRoleColor;
  // derive light bg from color
  ROLE_COLORS[name]=c;
  ROLE_BG[name]=c+'18';
  newRoleColor=ROLE_PRESET_COLORS[(ROLE_PRESET_COLORS.indexOf(c)+1)%ROLE_PRESET_COLORS.length];
  renderPeopleTab();
}
function saveRole(oldName){
  const id=_rId(oldName);
  const newName=(document.getElementById('redit-name-'+id).value||'').trim();
  if(!newName){alert('Name required');return;}
  const newColor=_roleEditColors[id]||ROLE_COLORS[oldName];
  if(newName!==oldName){
    // rename in ROLES array
    const idx=ROLES.indexOf(oldName);
    if(idx>=0)ROLES[idx]=newName;
    // update ROLE_COLORS/BG
    ROLE_COLORS[newName]=newColor;
    ROLE_BG[newName]=ROLE_BG[oldName]||newColor+'18';
    delete ROLE_COLORS[oldName];delete ROLE_BG[oldName];
    // update all people
    PEOPLE.forEach(p=>{if(p.role===oldName)p.role=newName;});
    if(npRole===oldName)npRole=newName;
  } else {
    ROLE_COLORS[oldName]=newColor;
    ROLE_BG[oldName]=newColor+'18';
  }
  delete _roleEditColors[id];
  editingRoleName=null;
  renderChips();renderBody();renderPeopleTab();
}
function confirmDelRole(name){
  const el=document.getElementById('role-del-confirm');if(!el)return;
  const count=PEOPLE.filter(p=>p.role===name).length;
  el.innerHTML=`<div style="background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;padding:10px 12px;margin-top:4px">
    <div style="font-size:12px;font-weight:700;color:#B91C1C;margin-bottom:4px">Delete role "${name}"?</div>
    ${count?`<div style="font-size:11px;color:#9CA3AF;margin-bottom:8px">${count} person${count!==1?'s':''} will have no role assigned.</div>`:''}
    <div class="confirm-row">
      <button class="btn-cancel" onclick="document.getElementById('role-del-confirm').innerHTML=''">Cancel</button>
      <button class="confirm-yes" onclick="doDelRole('${name}')">Yes, delete</button>
    </div>
  </div>`;
}
function doDelRole(name){
  ROLES=ROLES.filter(r=>r!==name);
  delete ROLE_COLORS[name];delete ROLE_BG[name];
  PEOPLE.forEach(p=>{if(p.role===name)p.role=undefined;});
  if(npRole===name)npRole=ROLES[0]||'';
  editingRoleName=null;
  renderChips();renderPeopleTab();
}

// track color being edited per person
const _pEditColors={};
function setPEditColor(ini,c){
  _pEditColors[ini]=c;
  const av=document.getElementById('pedit-av-'+ini);if(av)av.style.background=c;
  const cc=document.getElementById('pedit-colors-'+ini);
  if(cc)cc.innerHTML=colorSwatches(c,`setPEditColor('${ini}')`);
}

function savePersonEdit(oldName,ini){
  const p=PEOPLE.find(x=>x.name===oldName);if(!p)return;
  const newName=(document.getElementById('pedit-name-'+ini).value||'').trim();
  if(!newName){alert('Name required');return;}
  const role=document.getElementById('pedit-role-'+ini).value;
  const color=_pEditColors[ini]||p.color;
  // update task owners if name changed
  if(newName!==oldName){
    GROUPS.forEach(g=>g.tasks.forEach(t=>{
      t.o=t.o.map(o=>o===oldName?newName:o);
      if(t.subtasks)t.subtasks.forEach(s=>{s.owners=(s.owners||[]).map(o=>o===oldName?newName:o);});
    }));
    if(selPersons.has(oldName)){selPersons.delete(oldName);selPersons.add(newName);}
  }
  p.name=newName;p.role=role;p.color=color;p.initials=initials(newName);
  delete _pEditColors[ini];
  editingPersonName=null;
  renderChips();renderBody();renderPeopleTab();
}

function updateNpPreview(){
  const n=document.getElementById('np-name').value;
  document.getElementById('np-preview').textContent=n?initials(n):'?';

function setNpColor(c){

}
function addPerson(){
  const name=(document.getElementById('np-name').value||'').trim();
  const err=document.getElementById('np-err');
  if(!name){err.textContent='Name is required';return;}
  if(PEOPLE.find(p=>p.name.toLowerCase()===name.toLowerCase())){err.textContent='Person already exists';return;}
  const role=document.getElementById('np-role').value||'Frontend';
  PEOPLE.push({name,color:npColor,initials:initials(name),role});
  document.getElementById('np-name').value='';
  err.textContent='';
  renderChips();renderBody();renderPeopleTab();
}
function confirmDelPerson(name,ini){
  const elId='pdel-'+(ini||name.replace(/[^a-z0-9]/gi,'_'));
